apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: lab2-yelp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: lab2-yelp/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: lab2-yelp-config
            - secretRef:
                name: lab2-yelp-secret
          env:
            - name: SERVICE_NAME
              value: user-service
            - name: REVIEW_STATUS_CONSUMER_ENABLED
              value: "false"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: lab2-yelp
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
